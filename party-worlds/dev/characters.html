<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Character kit — contact sheet</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #ffe7c2; }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #labels { position: fixed; inset: 0; pointer-events: none; font-family: 'Barlow', system-ui, sans-serif; }
      .label {
        position: absolute; transform: translate(-50%, 0); white-space: nowrap; text-align: center;
        color: #22304f; font-weight: 600; font-size: 15px; line-height: 1.15;
        background: rgba(253, 250, 243, 0.86); border-radius: 10px; padding: 3px 9px 4px;
        box-shadow: 0 1px 0 rgba(34, 48, 79, 0.12);
      }
      .label small { display: block; font-weight: 400; font-size: 11px; opacity: 0.8; max-width: 230px; white-space: normal; }
      #stats {
        position: fixed; left: 10px; top: 10px; margin: 0; padding: 8px 12px; border-radius: 10px;
        background: rgba(34, 48, 79, 0.88); color: #fdfaf3; font: 12px/1.35 ui-monospace, Menlo, monospace;
        white-space: pre; display: none;
      }
      #hud {
        position: fixed; right: 10px; top: 10px; padding: 4px 10px; border-radius: 10px;
        background: rgba(253, 250, 243, 0.86); color: #22304f; font: 500 12px 'Barlow', system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="labels"></div>
    <pre id="stats"></pre>
    <div id="hud"></div>
    <script type="module" src="./characters.ts"></script>
  </body>
</html>
