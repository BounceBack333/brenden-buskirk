<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="night" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#2a2d6b"/>
      <stop offset="1" stop-color="#0b0c1e"/>
    </radialGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3d8b"/>
      <stop offset="1" stop-color="#ffb02e"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect id="plate" width="512" height="512" rx="112" fill="url(#night)"/>
  <!-- the circuit: one loop with a kink, like the minimap -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path id="loop" d="M150 196 C150 150 200 138 236 160 C272 182 300 150 336 150 C380 150 396 196 380 236 C366 272 392 300 380 336 C366 380 310 384 282 356 C254 328 222 372 182 366 C136 358 124 306 148 272 C166 246 150 226 150 196 Z" stroke="url(#hot)" stroke-width="40" opacity="0.55" filter="url(#glow)"/>
    <path d="M150 196 C150 150 200 138 236 160 C272 182 300 150 336 150 C380 150 396 196 380 236 C366 272 392 300 380 336 C366 380 310 384 282 356 C254 328 222 372 182 366 C136 358 124 306 148 272 C166 246 150 226 150 196 Z" stroke="url(#hot)" stroke-width="30"/>
    <path d="M150 196 C150 150 200 138 236 160 C272 182 300 150 336 150 C380 150 396 196 380 236 C366 272 392 300 380 336 C366 380 310 384 282 356 C254 328 222 372 182 366 C136 358 124 306 148 272 C166 246 150 226 150 196 Z" stroke="#fff6e8" stroke-width="4" stroke-dasharray="2 22" opacity="0.8"/>
  </g>
  <!-- one kart on it -->
  <circle cx="336" cy="150" r="30" fill="#5fe6ff" opacity="0.45" filter="url(#glow)"/>
  <circle cx="336" cy="150" r="20" fill="#5fe6ff" stroke="#0b0c1e" stroke-width="6"/>
</svg>
