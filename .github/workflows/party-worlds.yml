# Checks for the game in party-worlds/ only. It never touches, builds or deploys the portfolio
# site at the repository root, and it publishes nothing: it type-checks, runs the tests, compares
# the race simulation with its recorded fingerprint, builds, holds the build to its size budget,
# and then starts the built game in the runner's own Chrome to see that it boots and a race
# begins. Delete this file to switch it off.
name: Party Worlds checks

on:
  pull_request:
    paths:
      - 'party-worlds/**'
      - '.github/workflows/party-worlds.yml'
  push:
    branches: [main]
    paths:
      - 'party-worlds/**'

permissions:
  contents: read

concurrency:
  group: party-worlds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: party-worlds
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: party-worlds/package-lock.json
      - run: npm ci
      - name: Type-check, tests, race fingerprint, build, size budget
        run: npm run check
      - name: Start the built game in a browser
        run: npm run smoke
        env:
          SMOKE_CHANNEL: chrome
